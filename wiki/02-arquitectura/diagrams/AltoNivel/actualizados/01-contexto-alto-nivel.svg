<text x="1349" y="255" class="small">SQL</text>
<polyline points="1320,730 1360,730 1360,310 1410,310" class="edge" stroke-dasharray="7 6"/>
<text x="1348" y="838" class="small">Dispatch: solo rechazos</text>
<polyline points="1320,340 1375,340 1375,565 1410,565" class="edge"/>
<polyline points="460,310 460,115 1780,115 1780,420 1745,420" class="edge" stroke-dasharray="7 6"/>
<text x="790" y="110" class="small">Flutter ↔ Auth: sesión y JWT</text>
<polyline points="1410,725 1380,725 1380,885 610,885 610,445 580,445" class="edge" stroke-dasharray="7 6"/>
<text x="590" y="878" class="small">Realtime → Flutter: eventos, sin consultas a tablas de negocio</text>
<rect x="35" y="925" width="1730" height="270" rx="17" fill="#ffffff" stroke="#ccd9e9"/>
<text x="53" y="958" class="head">Límites, módulos e integraciones</text>
<rect x="55" y="980" width="530" height="190" rx="13" fill="#ffffff" stroke="#2373bd" stroke-width="1.6"/>
<rect x="55" y="995" width="5" height="28" rx="2" fill="#2373bd"/>
<text x="74" y="1014" class="head">Comunicación interna</text>
<text x="74" y="1045" style="font-size:17px">HTTP con contratos, timeout e idempotencia.</text>
<text x="74" y="1071" style="font-size:17px">Dispatch → Core: elegibilidad y asignación.</text>
<text x="74" y="1097" style="font-size:17px">Dispatch → Rules: ranking.</text>
<text x="74" y="1123" style="font-size:17px">Core ↔ Rules: evaluación y configuración.</text>
<rect x="615" y="980" width="550" height="190" rx="13" fill="#ffffff" stroke="#7353b5" stroke-width="1.6"/>
<rect x="615" y="995" width="5" height="28" rx="2" fill="#7353b5"/>
<text x="634" y="1014" class="head">Módulos funcionales M-01 a M-13</text>
<text x="634" y="1045" style="font-size:16px">Multi-tenant · Identidad · Directorio/KYC · Catálogo</text>
<text x="634" y="1071" style="font-size:16px">Solicitud/asignación · Cotización · Ejecución</text>
<text x="634" y="1097" style="font-size:16px">Calificación/cierre · Comunicación · Tarifario/reportes</text>
<text x="634" y="1123" style="font-size:16px">Pagos simulados · Operación · Shell/navegación</text>
<rect x="1195" y="980" width="550" height="190" rx="13" fill="#ffffff" stroke="#168163" stroke-width="1.6"/>
<rect x="1195" y="995" width="5" height="28" rx="2" fill="#168163"/>
<text x="1214" y="1014" class="head">Fronteras externas</text>
<text x="1214" y="1045" style="font-size:17px">Core integra Storage, Realtime y notificaciones.</text>
<text x="1214" y="1071" style="font-size:17px">FCM/APNs y pagos según alcance simulado.</text>
<text x="1214" y="1097" style="font-size:17px">Landing no llama al Gateway ni consulta datos.</text>
<text x="1214" y="1123" style="font-size:17px">Flutter no consulta PostgreSQL ni Storage.</text>
<rect x="0" y="1254" width="1800" height="66" fill="#10254b"/>
<text x="40" y="1282" class="small" style="fill:#ffffff">MANI · Vista documental actualizada · 24 nov 2026</text>
<text x="40" y="1305" class="small" style="fill:#d6e5f5">Fuentes: SAD §7–8 · Mapa de módulos · ADR-0027 / 0028 / 0030 / 0035 · ModeloDatos §6</text>
