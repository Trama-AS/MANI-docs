<text x="40" y="58" class="title">01 · Contexto y arquitectura de alto nivel</text>
<text x="40" y="92" class="subtitle">SOA distribuida y políglota · Tres servicios de negocio · Dominios internos, no servicios por CRUD</text>
<rect x="35" y="130" width="265" height="720" rx="17" fill="#eef4fb" stroke="#ccd9e9"/>
<text x="53" y="163" class="head">Personas</text>
<rect x="50" y="190" width="235" height="145" rx="13" fill="#ffffff" stroke="#2373bd" stroke-width="1.6"/>
<rect x="50" y="205" width="5" height="28" rx="2" fill="#2373bd"/>
<text x="69" y="224" class="head">Cliente</text>
<text x="69" y="255" style="font-size:18px">Solicita servicios,</text>
<text x="69" y="281" style="font-size:18px">aprueba cotizaciones</text>
<text x="69" y="307" style="font-size:18px">y califica.</text>
<rect x="50" y="360" width="235" height="170" rx="13" fill="#ffffff" stroke="#2373bd" stroke-width="1.6"/>
<rect x="50" y="375" width="5" height="28" rx="2" fill="#2373bd"/>
<text x="69" y="394" class="head">Aliado</text>
<text x="69" y="425" style="font-size:18px">Registra KYC, cotiza,</text>
<text x="69" y="451" style="font-size:18px">acepta ofertas y</text>
<text x="69" y="477" style="font-size:18px">ejecuta el servicio.</text>
<rect x="50" y="555" width="235" height="175" rx="13" fill="#ffffff" stroke="#2373bd" stroke-width="1.6"/>
<rect x="50" y="570" width="5" height="28" rx="2" fill="#2373bd"/>
<text x="69" y="589" class="head">Administrador</text>
<text x="69" y="620" style="font-size:18px">Gestiona el tenant,</text>
<text x="69" y="646" style="font-size:18px">usuarios, aliados y</text>
<text x="69" y="672" style="font-size:18px">verificación KYC.</text>
<rect x="50" y="755" width="235" height="75" rx="13" fill="#ffffff" stroke="#68778b" stroke-width="1.6"/>
<rect x="50" y="770" width="5" height="28" rx="2" fill="#68778b"/>
<text x="69" y="789" class="head">Visitante</text>
<rect x="345" y="310" width="235" height="160" rx="13" fill="#f5f1fc" stroke="#7353b5" stroke-width="1.6"/>
<rect x="345" y="325" width="5" height="28" rx="2" fill="#7353b5"/>
<text x="364" y="344" class="head">MANI-Flutter</text>
<text x="364" y="375" style="font-size:18px">Flutter / Dart</text>
<text x="364" y="401" style="font-size:18px">Aplicación web y móvil</text>
<text x="364" y="427" style="font-size:18px">Interfaz del usuario</text>
<rect x="345" y="650" width="235" height="160" rx="13" fill="#f5f1fc" stroke="#7353b5" stroke-width="1.6"/>
<rect x="345" y="665" width="5" height="28" rx="2" fill="#7353b5"/>
<text x="364" y="684" class="head">MANI-Landing</text>
<text x="364" y="715" style="font-size:18px">React + Vite / NGINX</text>
<text x="364" y="741" style="font-size:18px">Página pública estática</text>
<text x="364" y="767" style="font-size:18px">Redirige al login</text>
<rect x="635" y="310" width="225" height="190" rx="13" fill="#eef6ff" stroke="#2373bd" stroke-width="1.6"/>
<rect x="635" y="325" width="5" height="28" rx="2" fill="#2373bd"/>
<text x="654" y="344" class="head">API Gateway</text>
<text x="654" y="375" style="font-size:18px">MANI-APIGateway</text>
<text x="654" y="401" style="font-size:18px">NGINX · TLS</text>
<text x="654" y="427" style="font-size:18px">Enrutamiento y límites</text>
<text x="654" y="453" style="font-size:18px">X-Correlation-ID</text>
<rect x="910" y="130" width="430" height="720" rx="17" fill="#eef4fb" stroke="#ccd9e9"/>
<text x="928" y="163" class="head">Servicios de negocio</text>
<rect x="930" y="185" width="390" height="255" rx="13" fill="#effaf5" stroke="#168163" stroke-width="1.6"/>
<rect x="930" y="200" width="5" height="28" rx="2" fill="#168163"/>
<text x="949" y="219" class="head">Core · MANI-Node</text>
<text x="949" y="250" style="font-size:17px">Node.js · Un único desplegable</text>
<text x="949" y="276" style="font-size:17px">Tenants, identidad, perfiles y KYC</text>
<text x="949" y="302" style="font-size:17px">Catálogo, cobertura y disponibilidad</text>
<text x="949" y="328" style="font-size:17px">Clientes, sitios y solicitudes</text>
<text x="949" y="354" style="font-size:17px">Cotización, ejecución y cierre</text>
<text x="949" y="380" style="font-size:17px">Mensajería, reportes y pagos sandbox</text>
<text x="949" y="406" style="font-size:17px">Persiste asignación y estado canónico</text>
<rect x="930" y="465" width="390" height="150" rx="13" fill="#f5f1fc" stroke="#7353b5" stroke-width="1.6"/>
<rect x="930" y="480" width="5" height="28" rx="2" fill="#7353b5"/>
<text x="949" y="499" class="head">Rules · MANI-Java</text>
<text x="949" y="530" style="font-size:17px">Java · Reglas configurables por tenant</text>
<text x="949" y="556" style="font-size:17px">Ranking y validación tarifaria</text>
<text x="949" y="582" style="font-size:17px">Obtiene reglas y tarifas desde Core</text>
<rect x="930" y="640" width="390" height="185" rx="13" fill="#eef6ff" stroke="#2373bd" stroke-width="1.6"/>
<rect x="930" y="655" width="5" height="28" rx="2" fill="#2373bd"/>
<text x="949" y="674" class="head">Dispatch · MANI-.NET</text>
<text x="949" y="705" style="font-size:17px">.NET · Despacho y ofertas</text>
<text x="949" y="731" style="font-size:17px">Consulta elegibilidad a Core</text>
<text x="949" y="757" style="font-size:17px">Consulta ranking a Rules</text>
<text x="949" y="783" style="font-size:17px">Decide aceptación; Core la persiste</text>
<rect x="1390" y="130" width="375" height="720" rx="17" fill="#eefaf6" stroke="#ccd9e9"/>
<text x="1408" y="163" class="head">Supabase · por ambiente</text>
<rect x="1410" y="190" width="335" height="135" rx="13" fill="#ffffff" stroke="#168163" stroke-width="1.6"/>
<rect x="1410" y="205" width="5" height="28" rx="2" fill="#168163"/>
<text x="1429" y="224" class="head">PostgreSQL</text>
<text x="1429" y="255" style="font-size:16px">Una base compartida</text>
<text x="1429" y="281" style="font-size:16px">tenant_id + RLS</text>
<text x="1429" y="307" style="font-size:16px">Core y Dispatch: permisos por tabla</text>
<rect x="1410" y="365" width="335" height="110" rx="13" fill="#ffffff" stroke="#168163" stroke-width="1.6"/>
<rect x="1410" y="380" width="5" height="28" rx="2" fill="#168163"/>
<text x="1429" y="399" class="head">Auth</text>
<text x="1429" y="430" style="font-size:16px">Identidad, sesión y emisión de JWT</text>
<rect x="1410" y="515" width="335" height="110" rx="13" fill="#ffffff" stroke="#168163" stroke-width="1.6"/>
<rect x="1410" y="530" width="5" height="28" rx="2" fill="#168163"/>
<text x="1429" y="549" class="head">Storage</text>
<text x="1429" y="580" style="font-size:16px">Documentos KYC y fotografías</text>
<rect x="1410" y="665" width="335" height="110" rx="13" fill="#ffffff" stroke="#168163" stroke-width="1.6"/>
<rect x="1410" y="680" width="5" height="28" rx="2" fill="#168163"/>
<text x="1429" y="699" class="head">Realtime</text>
<text x="1429" y="730" style="font-size:16px">Transporte de eventos de mensajería</text>
