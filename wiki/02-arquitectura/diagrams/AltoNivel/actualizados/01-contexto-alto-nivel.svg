<text x="474" y="570" class="small">Login</text>
<polyline points="580,390 635,390" class="edge"/>
<text x="585" y="295" class="small">HTTPS + JWT</text>
<polyline points="860,415 890,415 890,280 930,280" class="edge"/>
<polyline points="860,415 890,415 890,540 930,540" class="edge"/>
<polyline points="860,415 890,415 890,730 930,730" class="edge"/>
